name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # 语法门:覆盖所有 .js(含不被入口加载的 dashboard.js / smoke-real.js)。
      # 用 node --check 而非 eslint,保持"零 npm 依赖,clone 即用"。
      # smoke-real.js 有意不进 CI:它访问真实校方服务并消耗配额
      - name: Syntax check
        run: |
          node -e "const fs=require('fs'),path=require('path');const files=[];const walk=d=>{for(const e of fs.readdirSync(d,{withFileTypes:true})){if(e.isDirectory()){if(e.name!=='node_modules')walk(path.join(d,e.name))}else if(e.name.endsWith('.js'))files.push(path.join(d,e.name))}};walk('.');for(const f of files)require('child_process').execFileSync(process.execPath,['--check',f],{stdio:'inherit'})"

  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # macOS runner 的登录钥匙串在无 GUI 会话下是锁定的,add-generic-password
      # 会报 "user interaction is not allowed"。建一个解锁的专用钥匙串设为默认,
      # 等价于真机上"用户已登录、钥匙串可用"的环境。仅 CI 环境准备,产品代码
      # 对真机行为不做任何让步
      - name: Prepare keychain (macOS only)
        if: runner.os == 'macOS'
        run: |
          security create-keychain -p ci "$HOME/Library/Keychains/ci.keychain-db"
          security list-keychains -d user -s "$HOME/Library/Keychains/ci.keychain-db"
          security default-keychain -s "$HOME/Library/Keychains/ci.keychain-db"
          security unlock-keychain -p ci "$HOME/Library/Keychains/ci.keychain-db"
          security set-keychain-settings -lut 21600 "$HOME/Library/Keychains/ci.keychain-db"
      # 跨平台"启动+存储"冒烟(临时状态目录,不访问学校服务、不消耗配额):
      # 验证各平台凭据存储原语(Windows DPAPI / macOS 钥匙串 / Linux 机器绑定
      # 加密)的写入-读回往返、proxy 无 token 启动探活、watch 守护调度循环
      - name: Platform smoke
        run: node scripts/platform-smoke.js
